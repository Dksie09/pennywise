# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Penny
options:
  bundleIdPrefix: com.dksie09
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Z6J23SZ7DJ        # your Apple ID team; change if you use a different account
targets:
  Penny:
    type: application
    platform: iOS
    sources: [Penny]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dksie09.pennywise
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pennywise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  PennyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PennyTests]
    dependencies:
      - target: Penny
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Penny:
    build:
      targets:
        Penny: all
    test:
      targets: [PennyTests]

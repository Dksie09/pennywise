# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Kharcha
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Kharcha:
    type: application
    platform: iOS
    sources: [Kharcha]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.kharcha
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kharcha
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  KharchaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KharchaTests]
    dependencies:
      - target: Kharcha
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kharcha:
    build:
      targets:
        Kharcha: all
    test:
      targets: [KharchaTests]
